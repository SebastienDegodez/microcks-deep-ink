name: React package

# The React workspace (react/): the @microcks/deep-ink package. It has its own lockfile.
# Nothing is published: the package is private, and the publish job only runs by hand, as a dry run by default.
on:
  push:
    branches: [main]
    paths:
      - "react/**"
      - "packages/tokens/**"
      - "packages/core/**"
      - "packages/plugin-sdk/**"
      - "packages/registry/src/css/**"
      - "packages/registry/items/**"
      - "packages/registry/parity/**"
      - "packages/registry/scripts/**"
      - "packages/registry/css-order.json"
      - "packages/registry/css-order.json"
      - ".github/workflows/react.yml"
  pull_request:
    paths:
      - "react/**"
      - "packages/tokens/**"
      - "packages/core/**"
      - "packages/plugin-sdk/**"
      - "packages/registry/src/css/**"
      - "packages/registry/items/**"
      - "packages/registry/parity/**"
      - "packages/registry/scripts/**"
      - "packages/registry/css-order.json"
      - "packages/registry/css-order.json"
      - ".github/workflows/react.yml"
  # storybooks.yml calls this workflow first and consumes its artifacts (deep-ink-dist, storybook-react).
  workflow_call:
    inputs:
      storybook:
        description: "Also build the React Storybook (artifact storybook-react)"
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      publish:
        description: "Run the publish job (dry run unless dry-run is unticked; the package is private, so npm refuses a real publish)"
        type: boolean
        default: false
      dry-run:
        description: "Dry run only"
        type: boolean
        default: true

permissions:
  contents: read

# github.workflow is the caller's name when called: a standalone run and a called run never cancel each other.
concurrency:
  group: ${{ github.workflow }}-react-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            react/pnpm-lock.yaml

      # Common inputs from the root workspace: tokens, the element bundles (core) and the registry CSS.
      - run: pnpm install --frozen-lockfile --filter "@microcks-deep-ink/registry..."
      - run: pnpm --filter "@microcks-deep-ink/registry..." build

      - run: pnpm -C react install --frozen-lockfile
      - run: pnpm -C react build
      - run: pnpm -C react lint
      - run: pnpm -C react typecheck
      - run: pnpm -C react test

      # Publishing readiness (nothing is published).
      - run: pnpm -C react/packages/deep-ink publint
      - run: pnpm -C react/packages/deep-ink attw
      - run: pnpm -C react/packages/deep-ink pack:check

      - uses: actions/upload-artifact@v4
        with:
          name: deep-ink-dist
          path: react/packages/deep-ink/dist
          if-no-files-found: error

      # The package docs. Built unless a caller passes storybook: false.
      - if: inputs.storybook != false
        run: pnpm -C react --filter storybook-react build-storybook
      - if: inputs.storybook != false
        uses: actions/upload-artifact@v4
        with:
          name: storybook-react
          path: react/apps/storybook/storybook-static
          if-no-files-found: error

  # Manual only. npm trusted publishing (OIDC, provenance): no token. Dry run by default; the package is
  # `private: true`, so a real publish fails until the maintainers decide to publish.
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: react
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: deep-ink-dist
          path: react/packages/deep-ink/dist
      - if: inputs.dry-run
        run: pnpm -C react/packages/deep-ink pack --dry-run
      - if: ${{ !inputs.dry-run }}
        working-directory: react/packages/deep-ink
        run: npm publish --provenance --access public
