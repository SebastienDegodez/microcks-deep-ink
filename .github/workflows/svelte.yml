name: Svelte package

# Isolated native Svelte family, Storybook and packed consumer. Nothing is published.
on:
  workflow_call:
    inputs:
      storybook:
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "svelte/**"
      - "react/apps/storybook/src/**"
      - "react/packages/deep-ink/**"
      - "react/pnpm-lock.yaml"
      - "apps/shared/**"
      - "packages/core/**"
      - "packages/demo-core/**"
      - "packages/demo-styles/**"
      - "packages/plugin-sdk/**"
      - "packages/tokens/**"
      - "packages/registry/src/css/**"
      - "packages/registry/src/angular/icon.ts"
      - "packages/registry/package.json"
      - "packages/registry/items/**"
      - "packages/registry/parity/**"
      - "packages/registry/css-order.json"
      - "packages/registry/scripts/build-css.mjs"
      - ".github/workflows/svelte.yml"
  pull_request:
    paths:
      - "svelte/**"
      - "react/apps/storybook/src/**"
      - "react/packages/deep-ink/**"
      - "react/pnpm-lock.yaml"
      - "apps/shared/**"
      - "packages/core/**"
      - "packages/demo-core/**"
      - "packages/demo-styles/**"
      - "packages/plugin-sdk/**"
      - "packages/tokens/**"
      - "packages/registry/src/css/**"
      - "packages/registry/src/angular/icon.ts"
      - "packages/registry/package.json"
      - "packages/registry/items/**"
      - "packages/registry/parity/**"
      - "packages/registry/css-order.json"
      - "packages/registry/scripts/build-css.mjs"
      - ".github/workflows/svelte.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svelte-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  svelte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            svelte/pnpm-lock.yaml
            react/pnpm-lock.yaml
      # The reference React package needs the two element bundles; docs/Copy read the built registry; stories import apps/shared;
      # the demo consumes the framework-neutral demo core (built) and the shared page stylesheets.
      - run: pnpm install --frozen-lockfile --filter @microcks-deep-ink/core... --filter @microcks-deep-ink/registry... --filter @microcks-deep-ink/storybook-shared... --filter @microcks/demo-core...
      - run: pnpm --filter @microcks-deep-ink/tokens build
      - run: pnpm --filter @microcks/demo-core build
      - run: pnpm --filter @microcks-deep-ink/plugin-sdk build
      - run: pnpm --filter @microcks-deep-ink/core build
      - run: pnpm --filter @microcks-deep-ink/registry build
      - run: pnpm -C react install --frozen-lockfile
      - run: pnpm -C react build
      - run: pnpm -C svelte install --frozen-lockfile
      - run: pnpm -C svelte lint
      - run: pnpm -C svelte build
      - run: pnpm -C svelte check
      - run: pnpm -C svelte test
      - run: pnpm -C svelte check:boundaries
      - run: pnpm -C svelte --filter demo-svelte build
      - uses: actions/upload-artifact@v7
        if: inputs.storybook
        with:
          name: demo-svelte
          path: svelte/apps/demo/dist
          if-no-files-found: error
      - run: node --test apps/shared/copy-panel/model.test.ts tools/a11y/storybook-jobs.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r svelte/test/parity/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: pnpm -C svelte parity
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: svelte-story-parity
          path: |
            svelte/test/parity/.artifacts/report.json
            svelte/test/parity/.artifacts/*.png
          if-no-files-found: warn
      - run: pnpm -C svelte build:storybook
      - run: python svelte/apps/storybook/scripts/check-story-source.py
      - uses: actions/upload-artifact@v7
        if: inputs.storybook
        with:
          name: storybook-svelte
          path: svelte/apps/storybook/storybook-static
          if-no-files-found: error
      - run: pnpm -C svelte smoke:package
      - run: test -s svelte/packages/deep-ink/dist/styles.css && test -s svelte/packages/deep-ink/dist/styles.no-fonts.css
      - run: pnpm -C svelte publint
