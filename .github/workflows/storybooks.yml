name: Build and publish demo Storybooks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:storybooks
      - name: Assemble site
        run: |
          mkdir -p site/react site/angular
          cp -r apps/storybook-react/storybook-static/* site/react/
          cp -r apps/storybook-angular/storybook-static/* site/angular/
          cat > site/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="robots" content="noindex,nofollow">
          <title>DEMO · Microcks Deep Ink</title>
          <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070B14;color:#E6EDF7;font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
          main{display:flex;flex-direction:column;gap:16px;padding:32px;max-width:560px}
          .demo{align-self:flex-start;font:600 13px/16px ui-monospace,monospace;letter-spacing:.08em;color:#06101F;background:#F5B83D;border-radius:4px;padding:6px 10px}
          h1{margin:0;font-size:32px}p{margin:0;color:#B4C2DA}
          .warn{border:1.5px dashed #F5B83D;border-radius:8px;padding:12px 16px;color:#E6EDF7}
          a{display:block;padding:14px 20px;border:1px solid #22324F;border-radius:8px;color:#86CEF5;text-decoration:none;background:#0B1220}a:hover{background:#16233A}</style>
          </head><body><main>
          <span class="demo">DEMO</span>
          <h1>Microcks Deep Ink</h1>
          <p>Demo Storybooks of a design system proposal for the Microcks UI v2: one set of Web Components, React and Angular wrappers.</p>
          <p class="warn">This is a demo, not an official Microcks release. Nothing is published on npm; components and APIs may change or disappear without notice.</p>
          <a href="./react/">React Storybook (demo) &rarr;</a><a href="./angular/">Angular Storybook (demo) &rarr;</a>
          </main></body></html>
          HTML
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
