name: Build, check and publish the demo site

# DEMO site: landing page, React Storybook, Angular Storybook and the clickable demo.
# Pull requests build and check everything; only pushes to main deploy to GitHub Pages.
#   react   the React workspace (react.yml): @microcks/deep-ink (dist) and the React Storybook
#   root    the root workspace: registry-selectors allowlist check, registry, tokens, core, CLI, Angular Storybook,
#           demo (it consumes the dist)
#   site    assembles the Pages site, runs the accessibility smoke run, uploads the Pages artifact on main
#   deploy  main only
on:
  push:
    branches: [main]
  pull_request:
    # svelte/ has svelte.yml, and react/apps/ (the React Storybook) is checked by react.yml.
    # apps/demo-react/src/ui/pages/** and packages/registry/src/css/** are not ignored: they run the
    # registry-selectors check in the root job (the allowlist itself lives in tools/fidelity/).
    paths-ignore:
      - "svelte/**"
      - "react/apps/**"
      - "docs/**"
      - "tools/fidelity/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pull requests: a new push cancels the previous run of the same PR.
# main: never cancel a running deploy. GitHub keeps at most one pending run per group, so after a
# burst of merges the running build finishes and only the latest pending one runs next.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  react:
    uses: ./.github/workflows/react.yml
    with:
      storybook: true

  root:
    needs: react
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No build needed: page CSS (apps/demo-react/src/ui/pages) must not reach into a registry class
      # (packages/registry/src/css) unless the selector is in the allowlist and documented in PUBLIC-CSS.md.
      - run: python3 -I tools/fidelity/registry-selectors.py --self-test
      - run: python3 -I tools/fidelity/registry-selectors.py . --check tools/fidelity/registry-selectors.allow
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The React package, built by the react job (the demo and the Angular fixtures consume it).
      - uses: actions/download-artifact@v4
        with:
          name: deep-ink-dist
          path: react/packages/deep-ink/dist

      # Registry (strict: no missing Angular/React file), tokens, core elements, CLI.
      - run: pnpm build
      - run: pnpm build:strict
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint

      # Angular Storybook and the demo.
      - run: pnpm --filter storybook-angular build-storybook
      - run: pnpm build:demo
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-angular
          path: apps/storybook-angular/storybook-static
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: demo
          path: apps/demo-react/dist
          if-no-files-found: error

  site:
    needs: [react, root]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: storybook-react
          path: artifacts/storybook-react
      - uses: actions/download-artifact@v4
        with:
          name: storybook-angular
          path: artifacts/storybook-angular
      - uses: actions/download-artifact@v4
        with:
          name: demo
          path: artifacts/demo
      - run: pnpm build:site
        env:
          REACT_STORYBOOK_DIR: artifacts/storybook-react
          ANGULAR_STORYBOOK_DIR: artifacts/storybook-angular
          DEMO_DIR: artifacts/demo

      # Accessibility smoke run: every story, every demo route, dark and light, axe + a11ylint (RGAA 4.1.2).
      - run: pnpm install --frozen-lockfile --filter a11y-tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - run: pnpm a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-report
          path: a11y-report
          if-no-files-found: warn

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
