name: Build, check and publish the demo site

# DEMO site: landing page, React Storybook, Angular Storybook and the clickable demo.
# Pull requests build and check everything; only pushes to main deploy to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pull requests: a new push cancels the previous run of the same PR.
# main: never cancel a running deploy. GitHub keeps at most one pending run per group, so after a
# burst of merges the running build finishes and only the latest pending one runs next.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Registry (strict: no missing Angular/React file), tokens, core elements, CLI.
      - run: pnpm build
      - run: pnpm build:strict
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint

      # Storybooks + demo, then the site that Pages serves.
      - run: pnpm build:storybooks
      - run: pnpm build:demo
      - run: pnpm build:site

      # Accessibility smoke run: every story, every demo route, dark and light, axe + a11ylint (RGAA 4.1.2).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - run: pnpm a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-report
          path: a11y-report
          if-no-files-found: warn

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
