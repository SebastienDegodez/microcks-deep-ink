  <svg class="di-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M9 9h11v11H9z" /><path d="M5 15H4V4h11v1" />
  </svg>
  Copy
</button>
<span role="status" aria-live="polite" class="di-sr-only"></span>
