<!--
  Field recipe. The label is visible and tied to the control with for/id.
  Help and error are tied with aria-describedby. Invalid: aria-invalid="true".
  The asterisk is decorative; the control carries the required attribute.
-->
<div class="field" data-invalid>
  <label class="label" for="name">Name <span class="required" aria-hidden="true">*</span></label>
  <input id="name" class="input" type="text" required aria-invalid="true" aria-describedby="name-help name-error" />
  <p class="help" id="name-help">Used in the mock URL.</p>
  <p class="error" id="name-error">
    <svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M6 6l12 12M18 6L6 18" />
    </svg>
    <span><span class="sr-only">Error: </span>Enter a name.</span>
  </p>
</div>
