     and remove it (and announce completion in a live region) when the content arrives. -->

  <h2 id="sk-title">Operations</h2>
  <span class="skeleton-group" aria-hidden="true" style="--skeleton-width: 100%">
    <span class="skeleton"></span>
    <span class="skeleton"></span>
    <span class="skeleton"></span>
  </span>
</section>
