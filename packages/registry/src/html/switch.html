<!--
  Switch recipe. A native checkbox with role="switch" inside its label.
  Space toggles it. Name the setting, not the state ("Notifications", not "On").
-->
<label class="di-choice">
  <input type="checkbox" role="switch" class="di-switch" name="stateful" checked />
  <span><span class="di-choice-label">Stateful mock</span></span>
</label>
