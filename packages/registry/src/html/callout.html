<!-- Callout. Tones: info | success | warning | danger | ai.
     The tone is carried by the icon AND the title text, never by color alone.
     Add role="status" (polite) or role="alert" (assertive) only for messages that appear after load. -->
<div class="di-callout" data-tone="warning" role="status" aria-labelledby="callout-1-title">
  <svg class="di-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 4l9 16H3z"/><path d="M12 10v4"/><path d="M12 17v.5"/></svg>
  <div class="di-callout-body">
    <p class="di-callout-title" id="callout-1-title">2 operations have no examples</p>
    <div class="di-callout-content">Add examples before you run a conformance test.</div>
    <div class="di-callout-actions"><a class="di-button" href="#examples">Add examples</a></div>
  </div>
</div>

  <div class="di-callout-body">
    <p class="di-callout-title" id="callout-2-title">Generated by AI, review needed</p>

  </div>
</div>
