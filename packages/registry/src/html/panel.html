<!--
  Panel recipe. The section is named by its heading (aria-labelledby).
  Pick the heading level that fits the page outline. data-flush removes the body padding.
-->
<section class="di-panel" aria-labelledby="ops-title">
  <div class="di-panel-header">
    <h2 class="di-panel-title" id="ops-title">Operations</h2>
    <div class="di-panel-actions">
      <button type="button" class="di-button" data-variant="secondary" data-size="sm">Add example</button>
    </div>
  </div>
  <div class="di-panel-body">Content</div>
</section>
