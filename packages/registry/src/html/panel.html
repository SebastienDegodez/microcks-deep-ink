<!--
  Panel recipe. The section is named by its heading (aria-labelledby).
  Pick the heading level that fits the page outline. data-flush removes the body padding.
  data-title="label" gives an uppercase 12px title; data-pad="lg" a 20px padding.
-->
<section class="panel" aria-labelledby="ops-title">
  <div class="panel-header">
    <h2 class="panel-title" id="ops-title">Operations</h2>
    <div class="panel-actions">
      <button type="button" class="button" data-variant="secondary" data-size="sm">Add example</button>
    </div>
  </div>
  <div class="panel-body">Content</div>
</section>
