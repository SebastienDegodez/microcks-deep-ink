<!--
  Checkbox and radio recipes. The input sits inside its label, so the whole row is the click target.
  A group of radios (or related checkboxes) is a fieldset with a legend.
-->
<label class="choice">
  <input type="checkbox" class="checkbox" name="validate" checked aria-describedby="validate-desc" />
  <span>
    <span class="choice-label">Validate each response against its OpenAPI schema</span>
    <span class="choice-description" id="validate-desc">Adds a Schema validation check to every step.</span>
  </span>
</label>

<fieldset class="fieldset">
  <legend>Run against</legend>
  <label class="choice">
    <input type="radio" class="radio" name="target" value="mocks" checked />
    <span><span class="choice-label">Mocks</span></span>
  </label>
  <label class="choice">
    <input type="radio" class="radio" name="target" value="implementations" />
    <span><span class="choice-label">Implementations</span></span>
  </label>
</fieldset>

<!-- Card variant: data-variant="card" on the fieldset and on each label. Checked = action border + selected fill. -->
<fieldset class="fieldset" data-variant="card">
  <legend>Install mode</legend>
  <label class="choice" data-variant="card">
    <input type="radio" class="radio" name="mode" value="sync" checked aria-describedby="mode-sync-desc" />
    <span>
      <span class="choice-label">Keep in sync</span>
      <span class="choice-description" id="mode-sync-desc">Microcks re-imports the package when the Hub publishes a new version.</span>
    </span>
  </label>
  <label class="choice" data-variant="card">
    <input type="radio" class="radio" name="mode" value="once" aria-describedby="mode-once-desc" />
    <span>
      <span class="choice-label">Import once</span>
      <span class="choice-description" id="mode-once-desc">A one-time copy; later versions are not imported.</span>
    </span>
  </label>
</fieldset>
