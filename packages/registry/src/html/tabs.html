<!--
  Tabs recipe (WAI-ARIA tabs pattern, automatic activation).
  Script contract: only the selected tab has tabindex="0"; the others have tabindex="-1".
  Left/Right move focus and select (wrap around), Home/End jump to the first/last tab.
  Set aria-selected, tabindex and the panel's hidden attribute when the selection changes.
-->
<div class="tabs">
  <div role="tablist" class="tablist" aria-label="Service sections">
    <button type="button" role="tab" class="tab" id="tab-operations" aria-selected="true" aria-controls="panel-operations" tabindex="0">
      Operations<span class="tab-count"><span class="sr-only">, </span>4</span>
    </button>
    <button type="button" role="tab" class="tab" id="tab-properties" aria-selected="false" aria-controls="panel-properties" tabindex="-1">
      Properties<span class="tab-alert"><span class="sr-only">, </span>2<span class="sr-only"> need attention</span></span>
    </button>
    <button type="button" role="tab" class="tab" id="tab-tests" aria-selected="false" aria-controls="panel-tests" tabindex="-1">
      <span class="tab-live" aria-hidden="true"></span>Tests<span class="sr-only">, live</span>
    </button>
  </div>
  <div role="tabpanel" class="tabpanel" id="panel-operations" aria-labelledby="tab-operations" tabindex="0">Operations content</div>
  <div role="tabpanel" class="tabpanel" id="panel-properties" aria-labelledby="tab-properties" tabindex="0" hidden></div>
  <div role="tabpanel" class="tabpanel" id="panel-tests" aria-labelledby="tab-tests" tabindex="0" hidden></div>
</div>

<!-- Card variant with icons and hints (Import source types). The icon is decorative; the hint follows a hidden ", ". -->
<div class="tabs" data-variant="card">
  <div role="tablist" class="tablist" aria-label="Source type">
    <button type="button" role="tab" class="tab" id="tab-file" aria-selected="true" aria-controls="panel-file" tabindex="0">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>Upload<span class="tab-hint"><span class="sr-only">,</span> one-off file</span>
    </button>
    <button type="button" role="tab" class="tab" id="tab-git" aria-selected="false" aria-controls="panel-git" tabindex="-1">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="7" r="2"/><path d="M6 7v10"/><path d="M18 9c0 5-6 4-12 8"/></svg>Git repository<span class="tab-hint"><span class="sr-only">,</span> kept in sync</span>
    </button>
  </div>
  <div role="tabpanel" class="tabpanel" id="panel-file" aria-labelledby="tab-file" tabindex="0">…</div>
  <div role="tabpanel" class="tabpanel" id="panel-git" aria-labelledby="tab-git" tabindex="0" hidden></div>
</div>
