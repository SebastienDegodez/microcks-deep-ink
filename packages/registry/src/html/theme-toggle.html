<!-- ThemeToggle. The label stays "Light theme"; aria-pressed="true" means the light theme is on. -->
<button type="button" class="button theme-toggle" data-variant="ghost" data-icon-only id="theme-toggle" aria-label="Light theme" aria-pressed="false">
  <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 8a4 4 0 1 1 0 8a4 4 0 1 1 0-8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>

<script>
  (function () {
    var KEY = 'microcks-theme';
    var btn = document.getElementById('theme-toggle');
    function apply(theme, persist) {
      document.documentElement.dataset.theme = theme;
      btn.setAttribute('aria-pressed', String(theme === 'light'));
      if (persist) { try { localStorage.setItem(KEY, theme); } catch (e) { /* storage blocked */ } }
      document.dispatchEvent(new CustomEvent('microcks-theme-change', { detail: theme }));
    }
    try { var saved = localStorage.getItem(KEY); if (saved === 'light' || saved === 'dark') apply(saved, false); } catch (e) { /* ignore */ }
    btn.addEventListener('click', function () {
      apply(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light', true);
    });
  })();
</script>
