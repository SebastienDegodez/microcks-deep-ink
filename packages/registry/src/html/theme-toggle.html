<!-- ThemeToggle. The label stays "Light theme"; aria-pressed="true" means the light theme is on. -->
<button type="button" class="button theme-toggle" data-variant="secondary" data-icon-only id="theme-toggle" aria-label="Light theme" aria-pressed="false">
  <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
</button>

<script>
  (function () {
    var KEY = 'microcks-theme';
    var btn = document.getElementById('theme-toggle');
    function apply(theme, persist) {
      document.documentElement.dataset.theme = theme;
      btn.setAttribute('aria-pressed', String(theme === 'light'));
      if (persist) { try { localStorage.setItem(KEY, theme); } catch (e) { /* storage blocked */ } }
      document.dispatchEvent(new CustomEvent('microcks-theme-change', { detail: theme }));
    }
    try { var saved = localStorage.getItem(KEY); if (saved === 'light' || saved === 'dark') apply(saved, false); } catch (e) { /* ignore */ }
    btn.addEventListener('click', function () {
      apply(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light', true);
    });
  })();
</script>
