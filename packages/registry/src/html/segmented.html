<!--
  Segmented filter recipe: a group of toggle buttons, one pressed at a time.
  Update aria-pressed in your click handler and announce the new result count in a live region.
-->
<div role="group" aria-label="Result" class="di-segmented">
  <button type="button" aria-pressed="true">All<span class="di-segmented-count"><span class="di-sr-only">, </span>12</span></button>
  <button type="button" aria-pressed="false">Passed<span class="di-segmented-count"><span class="di-sr-only">, </span>9</span></button>
  <button type="button" aria-pressed="false">Failed<span class="di-segmented-count"><span class="di-sr-only">, </span>3</span></button>
</div>
<p role="status" aria-live="polite" class="di-sr-only">12 results</p>
