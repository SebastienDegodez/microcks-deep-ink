<!-- StatusBadge. Icon (aria-hidden) + word, always. data-status: conformant | failed | partial | running | never.
     data-shape="circled" (summary: last test, last run) rings the icon; "never" is a dashed ring.
     data-shape="bare" (step and test outcomes) uses a plain check and cross. -->
<span class="status" data-status="conformant" data-size="md" data-shape="circled">
  <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12a9 9 0 1 1-18 0a9 9 0 1 1 18 0"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>
  <span>Conformant</span>
</span>
<span class="status" data-status="never" data-size="md" data-shape="circled">
  <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12a9 9 0 1 1-18 0a9 9 0 1 1 18 0" stroke-dasharray="3 3"/><path d="M8 12h8"/></svg>
  <span>Never tested</span>
</span>
<span class="status" data-status="failed" data-size="md" data-shape="bare">
  <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
  <span>Failed</span>
</span>
