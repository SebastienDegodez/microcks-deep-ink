<!-- CodeBlock. The <pre> scrolls, so it is focusable and named (role="region" + aria-label).
     Framed: a header with optional format tabs (toggle buttons, aria-pressed) and a link-style Copy.
     A bad line shows a visible 11px cross marker AND a visible note.
     The region's aria-label is the caption; when two blocks share a caption, add a suffix ("SendMessage · curl, JSON-RPC binding").
     data-gutter="narrow" (with data-numbered): a 28px gutter. data-tone="danger": the frame in the danger colour. Copy button: see copy-button. -->
<figure class="code" data-language="shell" data-variant="framed">
  <figcaption>
    <span class="code-tabs" role="group" aria-label="Format">
      <button type="button" aria-pressed="true">curl</button>
      <button type="button" aria-pressed="false">HTTPie</button>
    </span>
    <button type="button" class="button copy-button code-copy" data-variant="link" data-size="sm" data-copy="#code-1">Copy</button>
  </figcaption>
  <pre tabindex="0" role="region" aria-label="curl code"><code id="code-1" class="language-shell">curl -X GET 'http://microcks.local:8080/rest/API+Pastry/2.0/pastries/Millefeuille'</code></pre>
</figure>

<!-- Plain: just the bordered code, no header. -->
<figure class="code" data-variant="plain">
  <pre tabindex="0" role="region" aria-label="Stored as"><code>{"dispatcher": "URI_PARTS", "dispatcherRules": "name"}</code></pre>
</figure>

<!-- Numbered (narrow gutter, danger frame), with a bad line and its note inline. -->
<figure class="code" data-language="json" data-variant="plain" data-numbered data-gutter="narrow" data-tone="danger">
  <pre tabindex="0" role="region" aria-label="Response body"><code class="language-json"><span class="code-line"><span class="code-ln" aria-hidden="true">1</span><span class="code-text">{</span></span><span class="code-line"><span class="code-ln" aria-hidden="true">2</span><span class="code-text">  "name": "Eclair Cafe",</span></span><span class="code-line" data-bad><span class="code-ln" aria-hidden="true">3</span><span class="code-mark" aria-hidden="true"><svg class="icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg></span><span class="sr-only">Problem: </span><span class="code-text">  "price": "2.5"</span><span class="code-note">schema: number</span></span><span class="code-line"><span class="code-ln" aria-hidden="true">4</span><span class="code-text">}</span></span></code></pre>
</figure>

<!-- Diff: changed lines carry a visible "+" (22px column, kept empty on other lines) and a hidden "Changed: ". -->
<figure class="code" data-diff>
  <pre tabindex="0" role="region" aria-label="contract-tests.yml"><code><span class="code-line"><span class="code-mark" data-kind="changed" aria-hidden="true"></span><span class="code-text">jobs:</span></span><span class="code-line" data-changed><span class="code-mark" data-kind="changed" aria-hidden="true">+</span><span class="sr-only">Changed: </span><span class="code-text">  - name: Contract test API Pastry 2.0</span></span></code></pre>
</figure>

<!-- Header with a source: the caption gets data-title (uppercase title) and <span class="code-source"> sits at the end (mono).
     data-header-tone="raised": the header on the raised fill. -->
<figure class="code" data-language="json" data-variant="framed" data-header-tone="raised">
  <figcaption>
    <span class="code-caption" data-title>Expected</span>
    <span class="code-source">Pastry.json</span>
  </figcaption>
  <pre tabindex="0" role="region" aria-label="Expected, Pastry.json"><code class="language-json">{"name": "string", "price": "number"}</code></pre>
</figure>

<!-- Bare: no frame, no header, no padding — a <pre> inside a card that draws the frame.
     Focusable only when it scrolls (RGAA 7.3): measure the <pre> (scrollWidth > clientWidth or scrollHeight > clientHeight)
     and set tabindex="0" role="region" aria-label="…" only then; without overflow it is plain text, as below. -->
<figure class="code" data-variant="bare">
  <pre><code>{"name": "Millefeuille"}</code></pre>
</figure>

<!-- Pre only (React frame="none", Angular <pre mkCodeBlock>): just the <pre class="code-pre">, no figure, header or copy.
     The data-* hooks move onto the <pre>. framed/plain draw the hairline frame on the pre; bare is zero chrome
     (no border, radius or padding: the page keeps its own padding class).
     focusable="always": tabindex="0" role="region" aria-label="…"; "overflow": those only while it scrolls; "never": a plain <pre>, only for content that never scrolls (else keyboard users cannot scroll it, WCAG 2.1.1). -->
<pre class="code-pre" data-variant="bare" tabindex="0" role="region" aria-label="Input schema of getPastry"><code>{"type": "object", "properties": {"name": {"type": "string"}}}</code></pre>
<pre class="code-pre" data-variant="plain"><code>{"dispatcher": "URI_PARTS"}</code></pre>

<!-- Other hooks:
     - The caption text sits in <span class="code-caption" id="…"> inside the figcaption, between the tabs and Copy.
       It wraps long text and is hidden when empty.
     - A selected line: <span class="code-line" data-selected> (--selected fill, line number in --link). -->
