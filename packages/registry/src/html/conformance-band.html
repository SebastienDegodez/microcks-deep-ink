<!-- ConformanceBand. The band is role="img" with a label that spells out the counts.
     Fail cells are hatched and pass cells solid; untested cells are outlined. -->
<div class="conformance-wrap">
  <div class="conformance" data-size="full" role="img" aria-label="3 of 4 operations pass, 1 fails">
    <span data-result="pass"></span><span data-result="pass"></span><span data-result="pass"></span><span data-result="fail"></span>
  </div>
  <p class="conformance-summary">
    <span class="conformance-score" data-level="mid">75%</span>
    <span>3 of 4 operations pass, 1 fails</span>
  </p>
</div>

<!-- Mini: catalogue rows. -->
<div class="conformance" data-size="mini" role="img" aria-label="2 of 3 operations pass, 1 untested">
  <span data-result="pass"></span><span data-result="pass"></span><span data-result="untested"></span>
</div>
