<!-- DropZone. A native file input (visually hidden but focusable) named by a visible label.
     Drag and drop is an enhancement. The status line is a polite live region ("2 files ready"). -->
<div class="drop-zone" id="dz">
  <span class="drop-zone-icon" aria-hidden="true"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 16V4"/><path d="M6 10l6-6 6 6"/><path d="M4 20h16"/></svg></span>
  <p class="drop-zone-heading" id="dz-heading">Drop a contract anywhere</p>
  <p class="drop-zone-hint" id="dz-hint">OpenAPI, AsyncAPI, gRPC, GraphQL, Postman, SoapUI, HAR, Arazzo</p>
  <input id="dz-input" type="file" multiple class="drop-zone-input sr-only" aria-describedby="dz-heading dz-hint">
  <div class="drop-zone-actions">
    <label for="dz-input" class="button drop-zone-choose" data-variant="primary">Choose files</label>
  </div>
  <p class="drop-zone-status" role="status"></p>
</div>

<!-- Small (data-size="sm"): a compact zone in a panel, a bare 28px icon, a secondary Choose and extra actions. -->
<div class="drop-zone" id="dz-sm" data-size="sm">
  <span class="drop-zone-icon" aria-hidden="true"><svg class="icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 16V4"/><path d="M6 10l6-6 6 6"/><path d="M4 20h16"/></svg></span>
  <p class="drop-zone-heading" id="dz-sm-heading">Drop a snapshot here</p>
  <p class="drop-zone-hint" id="dz-sm-hint">A <code>microcks-repository.json</code> exported from any Microcks instance</p>
  <input id="dz-sm-input" type="file" accept="application/json,.json" class="drop-zone-input sr-only" aria-describedby="dz-sm-heading dz-sm-hint">
  <div class="drop-zone-actions">
    <label for="dz-sm-input" class="button drop-zone-choose" data-variant="secondary">Choose a file</label>
    <button type="button" class="button" data-variant="link">Use a sample snapshot</button>
  </div>
  <p class="drop-zone-status" role="status"></p>
</div>

<script>
  (function () {
    var zone = document.getElementById('dz');
    var input = document.getElementById('dz-input');
    var status = zone.querySelector('.drop-zone-status');
    function take(list) {
      if (!list || !list.length) return;
      status.textContent = list.length + (list.length === 1 ? ' file ready' : ' files ready');
      zone.dispatchEvent(new CustomEvent('files', { detail: Array.from(list), bubbles: true }));
    }
    input.addEventListener('change', function () { take(input.files); input.value = ''; });
    zone.addEventListener('dragover', function (e) { e.preventDefault(); zone.setAttribute('data-dragging', ''); });
    zone.addEventListener('dragleave', function (e) { if (!zone.contains(e.relatedTarget)) zone.removeAttribute('data-dragging'); });
    zone.addEventListener('drop', function (e) { e.preventDefault(); zone.removeAttribute('data-dragging'); take(e.dataTransfer.files); });
  })();
</script>
