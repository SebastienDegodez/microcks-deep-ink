<!-- LiveIndicator. Marks a real-time stream only. Not a status, not a live region. -->
<span class="di-live"><span class="di-live-dot" aria-hidden="true"></span>live</span>

<!-- Paused: add data-paused and write the word. -->
<span class="di-live" data-paused><span class="di-live-dot" aria-hidden="true"></span>live<span class="di-live-paused"> · paused</span></span>
