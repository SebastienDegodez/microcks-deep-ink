<!-- LiveIndicator. Marks a real-time stream only. Not a status, not a live region. -->
<span class="live"><span class="live-dot" aria-hidden="true"></span>live</span>

<!-- Paused: add data-paused and write the word. -->
<span class="live" data-paused><span class="live-dot" aria-hidden="true"></span>live<span class="live-paused"> · paused</span></span>
