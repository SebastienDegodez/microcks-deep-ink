<!--
  SplitPane. List + detail that wraps on narrow screens. Keep the panes in reading order in the DOM.
  Tune with custom properties: --split-side (260px), --split-side-max (360px), --split-main (520px), --split-gap (20px).
  Sources: data-balanced style="--split-side: 520px; --split-side-max: none; --split-main: 440px" (both panes grow alike).
  data-align="stretch" makes both panes the same height.
  data-keep-side-max keeps the --split-side-max cap below 720px too (by default the side pane then fills the row).
-->
<div class="split-pane">
  <nav class="split-pane-side" aria-label="Operations">
    <ul><li><button type="button" aria-pressed="true">GET /pastries</button></li></ul>
  </nav>
  <section class="split-pane-main" aria-labelledby="sp-detail">
    <h2 id="sp-detail">GET /pastries</h2>
  </section>
</div>
