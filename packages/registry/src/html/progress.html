<!-- Progress and Meter. Native elements with a visible label and a written value. -->
<div class="progress-field">
  <div class="progress-head">
    <label class="progress-label" for="import-progress">Importing contracts</label>
    <span class="progress-value">60%</span>
  </div>
  <progress class="progress" id="import-progress" value="60" max="100"></progress>
</div>

<div class="progress-field">
  <div class="progress-head">
    <label class="progress-label" for="conf-meter">Conformance</label>
    <span class="progress-value">11 of 12 operations</span>
  </div>
  <meter class="meter" id="conf-meter" value="11" min="0" max="12" low="6" high="9" optimum="12"></meter>
</div>
