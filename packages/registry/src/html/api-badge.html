<!-- ApiBadge. The visible text is the accessible name. Protocol: rest | soap | event | grpc | graphql | direct | a2a | arazzo.
     Leave a space between segments (whitespace between spans keeps the name readable). -->
<span class="api-badge" data-protocol="rest" data-size="md">
  <span class="api-badge-type">REST</span>
  <span class="api-badge-name">API Pastry</span>
  <span class="api-badge-version">2.0</span>
</span>

<!-- Page header sizes: lg (brand name 17px, beside an h1) and xl (brand name 30px, inside the h1). -->
<h1>
  <span class="api-badge" data-protocol="rest" data-size="xl">
    <span class="api-badge-type">REST</span>
    <span class="api-badge-name">API Pastry</span>
    <span class="api-badge-version">2.0</span>
  </span>
</h1>

<!-- Workflow: inverted left segment, never a protocol color. -->
<span class="api-badge" data-protocol="arazzo">
  <span class="api-badge-type">ARAZZO</span>
  <span class="api-badge-name">restock-pastry</span>
</span>

<!-- Proof: status fill with a hidden status word (the fill is never the only cue). -->
<span class="api-badge" data-status="success">
  <span class="api-badge-type">conformance</span>
  <span class="api-badge-name">92 % <span class="sr-only">(success)</span></span>
</span>

<!-- Proof with several values: each value is its own filled segment. -->
<span class="api-badge" data-status="neutral">
  <span class="api-badge-type">samples</span>
  <span class="api-badge-name">7</span>
  <span class="api-badge-value" data-status="warning">+1 AI <span class="sr-only">(warning)</span></span>
</span>

<!-- Card (badge wall): 13px; a long name is ellipsed (give the badge a max-width); the version in the text colour. -->
<span class="api-badge" data-protocol="event" data-size="card" style="max-width: 240px">
  <span class="api-badge-type">EVENT</span>
  <span class="api-badge-name">Pastry orders API</span>
  <span class="api-badge-version">0.1.0</span>
</span>

<!-- Neutral proof: muted value, 600 (no fill). Muted proof (data-status="muted"): raised fill, secondary text (inactive). -->
<span class="api-badge" data-status="neutral" data-size="md">
  <span class="api-badge-type">conformance</span>
  <span class="api-badge-name">untested</span>
</span>

<!-- Compact (12px rows) and the muted proof -->
<span class="api-badge" data-protocol="rest" data-size="compact"><span class="api-badge-type">REST</span> <span class="api-badge-name">API Pastry</span> <span class="api-badge-version">2.0</span></span>
<span class="api-badge" data-status="muted" data-size="compact"><span class="api-badge-type">last import</span> <span class="api-badge-name">inactive</span></span>

<!-- Unfilled proof values (Workflow proof strip): data-status="text" (600), "plain" (400), "positive" (success colour). -->
<span class="api-badge" data-status="text" data-size="compact"><span class="api-badge-type">runs · 7 d</span> <span class="api-badge-name">2/4 passed</span></span>
<span class="api-badge" data-status="positive" data-size="compact"><span class="api-badge-type">mock url</span> <span class="api-badge-name">ready</span></span>

<!-- Arazzo page title: mono tracked ARAZZO segment, the version in mono 13px on the name's baseline. -->
<h1 style="margin: 0"><span class="api-badge" data-protocol="arazzo" data-size="xl"><span class="api-badge-type">ARAZZO</span> <span class="api-badge-name">Restock a pastry</span> <span class="api-badge-version">1.2.0</span></span></h1>
