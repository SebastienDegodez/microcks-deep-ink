<!--
  Data table recipe.
  - The scroll wrapper is a focusable region named by the caption, so keyboard users can scroll it.
  - th scope="col" on headers; aria-sort only on the sorted column, with a button inside the th.
  - A row link is the first cell's <a class="table-rowlink">, stretched over the row. No clickable <tr>.
  A column header can be visually hidden (<th scope="col"><span class="sr-only">Open</span></th>) for an icon-only column.
  Cells wrap; add data-nowrap on a cell (or column) to keep it on one line. Only thead th is uppercase.
  data-header="sentence" on the table: sentence-case 12px headers, top-aligned cells, tabular figures.
  data-tone="failed" (surface fill), "danger" (danger tint) or "idle" (muted text, never opacity) on a body <tr>; the row still writes its state.
  data-layout="fixed" on the table: table-layout fixed, columns take the width set on their <th scope="col">, cells wrap anywhere.
  A table that never overflows can drop the scroll region: <div class="table-wrap" data-scroll="false"> without role,
  aria-labelledby or tabindex (no tab stop on something that does not scroll).
  Selectable row: the row header holds <button type="button" class="table-pick" aria-pressed="true|false">; the
  pressed row also carries data-selected.
-->
<div class="table-wrap" role="region" aria-labelledby="svc-caption" tabindex="0">
  <table class="table" data-density="comfortable">
    <caption id="svc-caption">Services</caption>
    <thead>
      <tr>
        <th scope="col" aria-sort="ascending"><button type="button" class="table-sort">Name
          <svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M12 19V5" /><path d="M6 11l6-6 6 6" />
          </svg></button></th>
        <th scope="col">Version</th>
        <th scope="col" data-align="end">Calls (24h)</th>
      </tr>
    </thead>
    <tbody>
      <tr data-selected>
        <td><a class="table-rowlink" href="/services/pastry2" aria-current="true">API Pastry</a></td>
        <td data-mono>2.0</td>
        <td data-align="end" data-mono>1,204</td>
      </tr>
      <tr>
        <td><a class="table-rowlink" href="/services/orders">Orders API</a></td>
        <td data-mono>0.1.0</td>
        <td data-align="end" data-mono>388</td>
      </tr>
    </tbody>
  </table>
</div>

<!-- No rows: one row whose single cell spans every column.
     <tbody><tr><td class="table-empty" colspan="4">No tests yet.</td></tr></tbody> -->

<!-- Fixed layout, no scroll region, selectable row headers (toggle buttons with aria-pressed). -->
<div class="table-wrap" data-scroll="false">
  <table class="table" data-density="comfortable" data-layout="fixed">
    <caption>Tasks</caption>
    <thead>
      <tr>
        <th scope="col" style="width: 116px">Task</th>
        <th scope="col">Skill</th>
        <th scope="col" style="width: 100px" data-align="end">Updated</th>
      </tr>
    </thead>
    <tbody>
      <tr data-selected>
        <th scope="row" data-mono><button type="button" class="table-pick" aria-pressed="true">task-7f3a</button></th>
        <td>restock-pastry</td>
        <td data-align="end">now</td>
      </tr>
      <tr>
        <th scope="row" data-mono><button type="button" class="table-pick" aria-pressed="false">task-41c2</button></th>
        <td>compare-prices</td>
        <td data-align="end">2 min ago</td>
      </tr>
    </tbody>
  </table>
</div>
