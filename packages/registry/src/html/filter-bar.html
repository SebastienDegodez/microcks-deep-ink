<!--
  FilterBar. A named <section> of filter rows. The first row holds the search field (a real label,
  visually hidden, with the placeholder repeating it); titled rows are role="group" named by their title.
  Reset is a link-style button at the end, disabled when no filter is active. Push a trailing group right with .filter-bar-end.
-->
<section class="filter-bar" aria-label="Catalogue filters">
  <div class="filter-bar-row">
    <label class="filter-bar-search">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 11a7 7 0 1 1-14 0a7 7 0 1 1 14 0"/><path d="M20 20l-3.5-3.5"/></svg>
      <span class="sr-only">Search APIs and services</span>
      <input type="search" placeholder="Search APIs and services" />
    </label>
    <span class="filter-bar-end"><!-- view toggle (segmented) --></span>
  </div>
  <div class="filter-bar-row" role="group" aria-labelledby="fb-proto">
    <span class="filter-bar-label" id="fb-proto">Protocol</span>
    <!-- protocol chips (chip data-protocol) -->
    <button type="button" class="filter-bar-reset">
      <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Reset (1)
    </button>
  </div>
</section>
