<!--
  Icon recipe. A 24px-grid stroke icon in currentColor.
  Decorative icons are hidden from assistive technology.
-->
<svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  <path d="M5 12l5 5 9-11" />
</svg>

<!-- Informative icon: give it a role and a name. -->
<svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Passed" focusable="false">
  <path d="M5 12l5 5 9-11" />
</svg>

<!-- Circled status icons: circles and rounded rects are written as arcs. "Never tested" dashes its ring. -->
<svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  <path d="M21 12a9 9 0 1 1-18 0a9 9 0 1 1 18 0" stroke-dasharray="3 3" />
  <path d="M8 12h8" />
</svg>
