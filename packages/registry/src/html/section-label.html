<!--
  SectionLabel. Put the class on the right element: a heading for a section, a <label for> for a field,
  a <span> for a caption. Write the text in normal case; CSS makes it uppercase.
  data-size="sm" (11px, .06em) | default md (12px, .04em). data-weight="regular" for 400.
  data-split spreads two children to both ends of the line.
-->
<h3 class="section-label">Endpoints</h3>
<label class="section-label" for="mock-url">Mock URL</label>
<h2 class="section-label" data-size="sm">1 · Operation</h2>
<div class="section-label" data-size="sm" data-weight="regular" data-split><span>3 operations</span><span>calls · 7 d</span></div>
