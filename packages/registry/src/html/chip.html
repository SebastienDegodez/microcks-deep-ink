<!--
  Chip recipe.
  Static label: a span. Filter toggle: a button with aria-pressed. Removable: a real button with a name.
  Tone: data-tone="neutral | info | success | warning | danger". Variant: data-variant="solid | outline | dashed".
-->
<span class="di-chip" data-tone="neutral" data-variant="solid"><span class="di-chip-key">domain=</span>pastry</span>

<span class="di-chip" data-tone="warning" data-variant="dashed">Proposed · beyond POC</span>

<!-- Toggle (filter) -->
<button type="button" class="di-chip" data-tone="neutral" data-variant="solid" aria-pressed="true">REST</button>

<!-- Removable -->
<span class="di-chip" data-tone="info" data-variant="solid">
  team=payments
  <button type="button" class="di-chip-remove" aria-label="Remove team=payments">
    <svg class="di-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M6 6l12 12M18 6L6 18" />
    </svg>
  </button>
</span>
