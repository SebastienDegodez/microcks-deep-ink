<!--
  Base recipe. Load tokens.css then base.css (or the generated index.css), then:
-->
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <main id="main" tabindex="-1">
    <div class="stack" style="--gap: var(--space-6)">
      <h1>Page title</h1>

      <div class="inline">
        <span>Items sit on one wrapping row</span>
        <span>with a gap set by --gap</span>
      </div>

      <!-- Text for screen readers only -->
      <span class="sr-only">Only announced, never seen</span>
    </div>
  </main>
</body>

<!--
  Route focus: after a route change, move focus to the page h1 (tabindex="-1"). Another target that is not a
  control takes data-route-focus with tabindex="-1": <section data-route-focus tabindex="-1" aria-label="Results">.
  base.css hides the ring on those programmatic focus targets only.
-->
