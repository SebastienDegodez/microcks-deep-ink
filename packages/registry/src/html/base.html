-->
<body>
  <a class="di-skip-link" href="#main">Skip to content</a>

  <main id="main" tabindex="-1">
    <div class="di-stack" style="--di-gap: var(--space-6)">
      <h1>Page title</h1>

      <div class="di-inline">
        <span>Items sit on one wrapping row</span>
        <span>with a gap set by --di-gap</span>
      </div>

      <!-- Text for screen readers only -->
      <span class="di-sr-only">Only announced, never seen</span>
    </div>
  </main>
</body>
