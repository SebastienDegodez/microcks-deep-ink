<!--

  and aria-hidden .summary-strip-sep separators. data-gap="roomy" for 10px rows, data-values="text" for values in --text.
  data-variant="canvas": --canvas fill, radius 8, padding 10px 14px, 6px rows, normal line height (Agent test setup strip).
  Add role="note" and an aria-label when the strip sums up the state of the form below it.
-->
